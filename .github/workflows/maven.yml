name: Vạn Bảo Các CI/CD
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build & Test
        run: mvn clean verify
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: van-bao-cac-backend
          path: target/*.jar
