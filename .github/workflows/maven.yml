name: Vạn Bảo Các CI/CD

on:
  push:
    branches: [ "main" , "dao" ]
  pull_request:
     branches: [ "main", "dao" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Khởi tạo container MySQL
      mysql-db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: "auction_db"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create second database
        run: |
          mysql -h 127.0.0.1 -u root -p123456 -e "CREATE DATABASE IF NOT EXISTS auction_db_test;"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
                java-version: '25' # Thay đổi phiên bản phù hợp với dự án của bạn (vd: 17, 21)
                distribution: 'temurin'
                cache: maven # Tối ưu hóa thời gian build bằng cách cache các dependency

      - name: Run Tests
        run: |
          # Chạy lệnh test của bạn ở đây
          # Đảm bảo code của bạn kết nối tới localhost:3306
          mvn test

      - name: Build
        run: mvn package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: van-bao-cac-backend
          path: target/*.jar
