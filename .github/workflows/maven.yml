name: Vạn Bảo Các CI/CD

on:
  push:
    branches: [ "main", "dao" ]

  pull_request:
    branches: [ "main", "dao" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/auction_db_test
      DB_USER: root
      DB_PASSWORD: 123456

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: auction_db

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Wait for MySQL
        env:
          MYSQL_PWD: 123456
        run: |
          until mysqladmin ping -h "127.0.0.1" -u root --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create test database
        env:
          MYSQL_PWD: 123456
        run: |
          mysql -h 127.0.0.1 -u root \
          -e "CREATE DATABASE IF NOT EXISTS auction_db_test;"

      - name: Create test database
        run: |
          mysql -h 127.0.0.1 -u root -p123456 \
          -e "CREATE DATABASE IF NOT EXISTS auction_db_test;"

      - name: Build & Test
        run: mvn --batch-mode clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: van-bao-cac-backend
          path: target/*.jar